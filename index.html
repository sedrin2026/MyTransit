<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>MY TRANSIT 🚌 🚇</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; margin: 0; padding: 10px 20px; color: #333; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 400px; width: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
    
    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 4px 0 8px 0;
    }

    /* 💡 修正：縦に伸びすぎないよう、高さの最大値を制限（object-fitで歪みを防止） */
    .app-header-image {
      width: 100%;
      max-height: 65px; /* タイトルの高さをコンパクトに調整 */
      object-fit: contain; /* 画像が縦横比を保ったまま枠内に収まるようにする */
      display: block;
    }

    .mode-select-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 8px;
      margin-top: 4px;
    }
    .mode-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    
    .btn-bus {
      background: linear-gradient(135deg, #ffc285 0%, #ff9e59 100%);
      box-shadow: 0 0 10px rgba(255, 170, 100, 0.4);
    }

    .btn-subway {
      background: linear-gradient(135deg, #a3b899 0%, #7d9670 100%);
      box-shadow: 0 0 10px rgba(125, 150, 112, 0.4);
    }

    .mode-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .mode-icon { 
      font-size: 1.1rem; 
      display: inline-flex;
      align-items: center;
      transform: translateY(-1px);
    }

    .bus-stop-panel {
      display: none;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #ff9e59;
    }
    .bus-stop-panel.active {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .subway-stop-panel {
      display: none;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #7d9670;
    }
    .subway-stop-panel.active {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .radio-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #2c3e50;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bus-stop-panel input[type="radio"] {
      accent-color: #ff8c32;
      transform: scale(1.1);
    }
    .subway-stop-panel input[type="radio"] {
      accent-color: #7d9670;
      transform: scale(1.1);
    }

    .sub-title {
      position: relative;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      color: #d96b00;
      background: #ffffff;
      border: 2px solid #ffb37e;
      border-radius: 8px;
      padding: 8px 40px 8px 10px;
      margin: 10px 0;
      box-shadow: 0 0 10px rgba(255, 179, 126, 0.25);
      display: none;
    }
    .sub-title.subway-theme {
      color: #4a633d;
      border: 2px solid #a3b899;
      box-shadow: 0 0 10px rgba(163, 184, 153, 0.3);
    }
    
    .close-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #f0f4f8;
      border: 1px solid #bcd;
      color: #666;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-btn:active {
      background: #e0e0e0;
      transform: translateY(-50%) scale(0.9);
    }

    .btn { 
      width: 100%; 
      padding: 12px 10px; 
      font-size: 1rem; 
      font-weight: 800; 
      color: #ffffff; 
      background: linear-gradient(135deg, #89c4f4 0%, #5b9bd5 100%); 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      box-shadow: 0 0 10px rgba(91, 155, 213, 0.35); 
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .btn.subway-theme {
      background: linear-gradient(135deg, #a3b899 0%, #68825b 100%);
      box-shadow: 0 0 12px rgba(125, 150, 112, 0.4);
    }
    .btn:active { 
      transform: scale(0.97); 
    }

    .home-maps-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 4px 0 10px 0;
      width: 100%;
    }
    .map-card {
      width: 100%;
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 6px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .map-card.bus-map-card {
      background: linear-gradient(135deg, #fffaf4 0%, #fff2e6 100%);
      border: 1px solid #ffbc85;
      box-shadow: 0 2px 8px rgba(255, 158, 89, 0.15);
    }
    .map-card.bus-map-card .map-title {
      color: #d96b00;
      font-weight: 800;
    }

    .map-card.subway-map-card {
      background: linear-gradient(135deg, #f6f8f5 0%, #ebf0ea 100%);
      border: 1px solid #a3b899;
      box-shadow: 0 2px 8px rgba(125, 150, 112, 0.15);
    }
    .map-card.subway-map-card .map-title {
      color: #4a633d;
      font-weight: 800;
    }

    .map-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
    }
    .map-image {
      max-width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
    }

    .calendar-container {
      display: none;
      width: 100%;
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid #7ea8f8;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    .calendar-container.active {
      display: block;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #3b5998;
      font-size: 0.9rem;
      margin-bottom: 6px;
      padding: 0 4px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      font-size: 0.8rem;
    }
    .calendar-day-header {
      font-weight: bold;
      padding: 2px 0;
      color: #666;
    }
    .calendar-day-header.sun { color: #e74c3c; }
    .calendar-day-header.sat { color: #3498db; }
    .calendar-cell {
      padding: 6px 0;
      border-radius: 4px;
      color: #333;
    }
    .calendar-cell.sun { color: #e74c3c; }
    .calendar-cell.sat { color: #3498db; }
    .calendar-cell.today {
      background-color: #5b9bd5;
      color: #ffffff;
      font-weight: bold;
      border-radius: 50%;
    }

    .results { margin-top: 10px; }
    .card { 
      background: white; 
      padding: 12px 14px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
      border: 1px solid #eee;
    }

    .candidate-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .cand-0 { background-color: #ffeef0; color: #dc3545; border: 1px solid #f5c6cb; }
    .cand-1 { background-color: #eafaf1; color: #28a745; border: 1px solid #c3e6cb; }
    .cand-2 { background-color: #edf5ff; color: #007bff; border: 1px solid #b8daff; }
    .cand-3 { background-color: #fff9e6; color: #d97706; border: 1px solid #fde68a; }
    .cand-4 { background-color: #f3e8ff; color: #7c3aed; border: 1px solid #ddd6fe; }

    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .time-box { display: flex; align-items: center; gap: 8px; }
    .rank-mark { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .mark-0 { background: #dc3545; }
    .mark-1 { background: #28a745; }
    .mark-2 { background: #007bff; }
    .mark-3 { background: #d97706; }
    .mark-4 { background: #7c3aed; }

    .time { font-size: 1.3rem; font-weight: bold; color: #111; }
    .arrow { color: #888; font-size: 0.85rem; }
    .mins { font-size: 0.8rem; font-weight: bold; padding: 3px 6px; border-radius: 6px; }
    
    .badge-0 { background: #f8d7da; color: #721c24; }
    .badge-1 { background: #d4edda; color: #155724; }
    .badge-2 { background: #cce5ff; color: #00
