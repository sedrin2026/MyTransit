<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>My Transit 🚌 🚇</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; margin: 0; padding: 10px 20px; color: #333; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 400px; width: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
    
    /* ヘッダーエリア：1枚のバナー画像をピッタリ配置 */
    .app-header {
      width: 100%;
      margin: 4px 0 10px 0;
      display: flex;
      justify-content: center;
    }

    .header-banner-img {
      width: 100%;
      height: auto;
      max-height: 90px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.1));
    }

    .mode-select-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 8px;
      margin-top: 4px;
    }
    .mode-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    
    .btn-bus {
      background: linear-gradient(135deg, #ffc285 0%, #ff9e59 100%);
      box-shadow: 0 0 10px rgba(255, 170, 100, 0.4);
    }

    .btn-subway {
      background: linear-gradient(135deg, #a3b899 0%, #7d9670 100%);
      box-shadow: 0 0 10px rgba(125, 150, 112, 0.4);
    }

    .mode-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .mode-icon { 
      font-size: 1.1rem; 
      display: inline-flex;
      align-items: center;
      transform: translateY(-1px);
    }

    .bus-stop-panel {
      display: none;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #ff9e59;
    }
    .bus-stop-panel.active {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .subway-stop-panel {
      display: none;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #7d9670;
    }
    .subway-stop-panel.active {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .radio-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #2c3e50;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bus-stop-panel input[type="radio"] {
      accent-color: #ff8c32;
      transform: scale(1.1);
    }
    .subway-stop-panel input[type="radio"] {
      accent-color: #7d9670;
      transform: scale(1.1);
    }

    .sub-title {
      position: relative;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      color: #d96b00;
      background: #ffffff;
      border: 2px solid #ffb37e;
      border-radius: 8px;
      padding: 8px 40px 8px 10px;
      margin: 10px 0;
      box-shadow: 0 0 10px rgba(255, 179, 126, 0.25);
      display: none;
    }
    .sub-title.subway-theme {
      color: #4a633d;
      border: 2px solid #a3b899;
      box-shadow: 0 0 10px rgba(163, 184, 153, 0.3);
    }
    
    .close-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #f0f4f8;
      border: 1px solid #bcd;
      color: #666;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-btn:active {
      background: #e0e0e0;
      transform: translateY(-50%) scale(0.9);
    }

    .btn { 
      width: 100%; 
      padding: 12px 10px; 
      font-size: 1rem; 
      font-weight: 800; 
      color: #ffffff; 
      background: linear-gradient(135deg, #89c4f4 0%, #5b9bd5 100%); 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      box-shadow: 0 0 10px rgba(91, 155, 213, 0.35); 
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .btn.subway-theme {
      background: linear-gradient(135deg, #a3b899 0%, #68825b 100%);
      box-shadow: 0 0 12px rgba(125, 150, 112, 0.4);
    }
    .btn:active { 
      transform: scale(0.97); 
    }

    .home-maps-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 4px 0 10px 0;
      width: 100%;
    }
    .map-card {
      width: 100%;
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 6px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .map-card.bus-map-card {
      background: linear-gradient(135deg, #fffaf4 0%, #fff2e6 100%);
      border: 1px solid #ffbc85;
      box-shadow: 0 2px 8px rgba(255, 158, 89, 0.15);
    }
    .map-card.bus-map-card .map-title {
      color: #d96b00;
      font-weight: 800;
    }

    .map-card.subway-map-card {
      background: linear-gradient(135deg, #f6f8f5 0%, #ebf0ea 100%);
      border: 1px solid #a3b899;
      box-shadow: 0 2px 8px rgba(125, 150, 112, 0.15);
    }
    .map-card.subway-map-card .map-title {
      color: #4a633d;
      font-weight: 800;
    }

    .map-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
    }

    .map-link {
      display: block;
      width: 100%;
      text-decoration: none;
    }
    .map-image {
      max-width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
      cursor: zoom-in;
    }

    .calendar-container {
      display: none;
      width: 100%;
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid #7ea8f8;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    .calendar-container.active {
      display: block;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #3b5998;
      font-size: 0.9rem;
      margin-bottom: 6px;
      padding: 0 4px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      font-size: 0.8rem;
    }
    .calendar-day-header {
      font-weight: bold;
      padding: 2px 0;
      color: #666;
    }
    .calendar-day-header.sun { color: #e74c3c; }
    .calendar-day-header.sat { color: #3498db; }
    .calendar-cell {
      padding: 6px 0;
      border-radius: 4px;
      color: #333;
    }
    .calendar-cell.sun { color: #e74c3c; }
    .calendar-cell.sat { color: #3498db; }
    .calendar-cell.today {
      background-color: #5b9bd5;
      color: #ffffff;
      font-weight: bold;
      border-radius: 50%;
    }

    .results { margin-top: 10px; }
    .card { 
      background: white; 
      padding: 12px 14px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
      border: 1px solid #eee;
    }

    .candidate-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .cand-0 { background-color: #ffeef0; color: #dc3545; border: 1px solid #f5c6cb; }
    .cand-1 { background-color: #eafaf1; color: #28a745; border: 1px solid #c3e6cb; }
    .cand-2 { background-color: #edf5ff; color: #007bff; border: 1px solid #b8daff; }
    .cand-3 { background-color: #fff9e6; color: #d97706; border: 1px solid #fde68a; }
    .cand-4 { background-color: #f3e8ff; color: #7c3aed; border: 1px solid #ddd6fe; }

    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .time-box { display: flex; align-items: center; gap: 8px; }
    .rank-mark { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .mark-0 { background: #dc3545; }
    .mark-1 { background: #28a745; }
    .mark-2 { background: #007bff; }
    .mark-3 { background: #d97706; }
    .mark-4 { background: #7c3aed; }

    .time { font-size: 1.3rem; font-weight: bold; color: #111; }
    .arrow { color: #888; font-size: 0.85rem; }
    .mins { font-size: 0.8rem; font-weight: bold; padding: 3px 6px; border-radius: 6px; }
    
    .badge-0 { background: #f8d7da; color: #721c24; }
    .badge-1 { background: #d4edda; color: #155724; }
    .badge-2 { background: #cce5ff; color: #004085; }
    .badge-3 { background: #fef3c7; color: #92400e; }
    .badge-4 { background: #ede9fe; color: #5b21b6; }

    .details { font-size: 0.8rem; color: #666; margin-top: 8px; }
    
    .route-badge { 
      background: #ff8c32; 
      padding: 2px 6px; 
      border-radius: 4px; 
      font-weight: bold; 
      color: #ffffff; 
    }

    .empty { text-align: center; color: #777; margin-top: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 最上部タイトルバナー（1枚画像） -->
    <div class="app-header">
      <img src="header-banner.png" alt="My Transit" class="header-banner-img">
    </div>

    <div class="mode-select-container">
      <button class="mode-btn btn-bus" onclick="toggleBusPanel()">
        <span class="mode-icon">🚍</span> バス停から選択
      </button>
      <button class="mode-btn btn-subway" onclick="toggleSubwayPanel()">
        <span class="mode-icon">🚇</span> 地下鉄から選択
      </button>
    </div>

    <div class="bus-stop-panel" id="bus-panel">
      <label class="radio-label">
        <input type="radio" name="transitStop" value="三軒屋" onchange="changeBusStop('三軒屋')"> 三軒屋
      </label>
      <label class="radio-label">
        <input type="radio" name="transitStop" value="次郎丸" onchange="changeBusStop('次郎丸')"> 次郎丸
      </label>
    </div>

    <div class="subway-stop-panel" id="subway-panel">
      <label class="radio-label">
        <input type="radio" name="transitStop" value="次郎丸駅" onchange="changeSubwayStop('次郎丸駅')"> 次郎丸駅
      </label>
      <label class="radio-label">
        <input type="radio" name="transitStop" value="橋本駅" onchange="changeSubwayStop('橋本駅')"> 橋本駅
      </label>
    </div>

    <div class="sub-title" id="route-title">
      <span id="route-text"></span>
      <button class="close-btn" onclick="resetToInitialState()" title="閉じる">✕</button>
    </div>

    <button class="btn" id="update-btn" onclick="handleDateBtnClick()">----年--月--日(--) --:--:--</button>

    <div class="home-maps-container" id="home-maps">
      <div class="map-card bus-map-card">
        <div class="map-title">🚌 西鉄バス路線図</div>
        <a href="bus-map.png" target="_blank" class="map-link">
          <img src="bus-map.png" alt="バス路線図" class="map-image">
        </a>
      </div>
      <div class="map-card subway-map-card">
        <div class="map-title">🚇 福岡市地下鉄 路線図</div>
        <a href="subway-map.png" target="_blank" class="map-link">
          <img src="subway-map.png" alt="地下鉄路線図" class="map-image">
        </a>
      </div>
    </div>

    <div class="calendar-container" id="calendar-area">
      <div class="calendar-header" id="calendar-month-title">2026年 8月</div>
      <div class="calendar-grid">
        <div class="calendar-day-header sun">日</div>
        <div class="calendar-day-header">月</div>
        <div class="calendar-day-header">火</div>
        <div class="calendar-day-header">水</div>
        <div class="calendar-day-header">木</div>
        <div class="calendar-day-header">金</div>
        <div class="calendar-day-header sat">土</div>
      </div>
      <div class="calendar-grid" id="calendar-days"></div>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script>
    let currentMode = ''; 
    let isStopSelected = false;
    let currentSelectedStop = '';

    function formatDestination(dest) {
      if (!dest) return '';
      return dest.replace(/天神\s*core|天神コア前|天神コア/gi, '天神');
    }

    function toggleBusPanel() {
      const busPanel = document.getElementById('bus-panel');
      const subwayPanel = document.getElementById('subway-panel');
      subwayPanel.classList.remove('active');
      busPanel.classList.toggle('active');
      
      if (document.getElementById('calendar-area').classList.contains('active')) {
        closeCalendar();
      }
    }

    function toggleSubwayPanel() {
      const busPanel = document.getElementById('bus-panel');
      const subwayPanel = document.getElementById('subway-panel');
      busPanel.classList.remove('active');
      subwayPanel.classList.toggle('active');
      
      if (document.getElementById('calendar-area').classList.contains('active')) {
        closeCalendar();
      }
    }

    function changeBusStop(name) {
      closeCalendar();
      currentMode = 'bus';
      isStopSelected = true;
      currentSelectedStop = name;
      
      const title = document.getElementById('route-title');
      const text = document.getElementById('route-text');
      const btn = document.getElementById('update-btn');

      title.className = 'sub-title';
      btn.className = 'btn';
      title.style.display = 'block';
      
      document.getElementById('home-maps').style.display = 'none';

      if (name === '三軒屋') {
        text.innerText = '三軒屋 ➔ 次郎丸駅前';
      } else {
        text.innerText = '次郎丸 ➔ 三軒屋';
      }
      updateSchedule();
    }

    function changeSubwayStop(name) {
      closeCalendar();
      currentMode = 'subway';
      isStopSelected = true;
      currentSelectedStop = name;

      const title = document.getElementById('route-title');
      const text = document.getElementById('route-text');
      const btn = document.getElementById('update-btn');

      title.className = 'sub-title subway-theme';
      btn.className = 'btn subway-theme';
      title.style.display = 'block';

      document.getElementById('home-maps').style.display = 'none';

      if (name === '次郎丸駅') {
        text.innerText = '次郎丸駅 ➔ 橋本駅';
      } else if (name === '橋本駅') {
        text.innerText = '橋本駅 ➔ 次郎丸駅';
      }

      updateSchedule();
    }

    function resetToInitialState() {
      currentMode = '';
      isStopSelected = false;
      currentSelectedStop = '';
      
      document.getElementById('route-title').style.display = 'none';
      document.getElementById('bus-panel').classList.remove('active');
      document.getElementById('subway-panel').classList.remove('active');
      
      document.getElementById('home-maps').style.display = 'flex';
      
      const btn = document.getElementById('update-btn');
      btn.className = 'btn';

      const radios = document.getElementsByName('transitStop');
      radios.forEach(radio => radio.checked = false);

      document.getElementById('results').innerHTML = '';
      closeCalendar();
    }

    function handleDateBtnClick() {
      if (!isStopSelected) {
        const cal = document.getElementById('calendar-area');
        if (cal.classList.contains('active')) {
          cal.classList.remove('active');
          document.getElementById('home-maps').style.display = 'flex';
        } else {
          renderCalendar();
          cal.classList.add('active');
          document.getElementById('home-maps').style.display = 'none';
        }
      } else {
        updateSchedule();
      }
    }

    function closeCalendar() {
      document.getElementById('calendar-area').classList.remove('active');
      if (!isStopSelected) {
        document.getElementById('home-maps').style.display = 'flex';
      }
    }

    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth(); 
      const todayDate = now.getDate();

      document.getElementById('calendar-month-title').innerText = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const daysContainer = document.getElementById('calendar-days');
      daysContainer.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-cell';
        daysContainer.appendChild(emptyCell);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dayCell = document.createElement('div');
        const dayOfWeek = (firstDay + d - 1) % 7;
        
        dayCell.className = 'calendar-cell';
        if (dayOfWeek === 0) dayCell.classList.add('sun');
        if (dayOfWeek === 6) dayCell.classList.add('sat');
        if (d === todayDate) dayCell.classList.add('today');

        dayCell.innerText = d;
        daysContainer.appendChild(dayCell);
      }
    }

    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayList = ['日', '月', '火', '水', '木', '金', '土'];
      const day = dayList[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      const btn = document.getElementById('update-btn');
      btn.innerText = `${year}年${month}月${date}日(${day}) ${hours}:${mins}:${secs}`;
    }

    function isJapaneseHoliday(date) {
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const dayOfWeek = date.getDay();

      const isNthMonday = (n) => dayOfWeek === 1 && Math.ceil(day / 7) === n;
      const getShunbun = (y) => Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
      const getShuubun = (y) => Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));

      if (month === 1 && day === 1) return true;
      if (month === 2 && day === 11) return true;
      if (month === 2 && day === 23) return true;
      if (month === 4 && day === 29) return true;
      if (month === 5 && day === 3) return true;
      if (month === 5 && day === 4) return true;
      if (month === 5 && day === 5) return true;
      if (month === 8 && day === 11) return true;
      if (month === 11 && day === 3) return true;
      if (month === 11 && day === 23) return true;

      if (month === 1 && isNthMonday(2)) return true;
      if (month === 7 && isNthMonday(3)) return true;
      if (month === 9 && isNthMonday(3)) return true;
      if (month === 10 && isNthMonday(2)) return true;

      if (month === 3 && day === getShunbun(year)) return true;
      if (month === 9 && day === getShuubun(year)) return true;

      const yesterday = new Date(date);
      yesterday.setDate(date.getDate() - 1);
      if (dayOfWeek === 1 && isJapaneseHoliday(yesterday)) return true;

      return false;
    }

    function getBusJsonPath(now) {
      const dayOfWeek = now.getDay();
      if (dayOfWeek === 0 || isJapaneseHoliday(now)) {
        return './bus_holiday.json';
      } else if (dayOfWeek === 6) {
        return './bus_saturday.json';
      } else {
        return './bus_weekday.json';
      }
    }

    function getSubwayJsonPath(now) {
      const dayOfWeek = now.getDay();
      if (dayOfWeek === 0 || isJapaneseHoliday(now)) {
        return './subway_holiday.json';
      } else if (dayOfWeek === 6) {
        return './subway_saturday.json';
      } else {
        return './subway_weekday.json';
      }
    }

    async function updateSchedule() {
      updateClock();

      if (!isStopSelected) {
        document.getElementById('results').innerHTML = '';
        return;
      }

      const container = document.getElementById('results');

      try {
        const now = new Date();
        const currentHours = now.getHours();
        const currentMins = now.getMinutes();
        const currentTotalMins = currentHours * 60 + currentMins;

        let targetData = [];

        if (currentMode === 'bus') {
          const jsonPath = getBusJsonPath(now);
          const response = await fetch(jsonPath);
          targetData = await response.json();
        } else if (currentMode === 'subway') {
          const jsonPath = getSubwayJsonPath(now);
          const response = await fetch(jsonPath);
          targetData = await response.json();
        }

        const upcoming = targetData
          .filter(item => item.from === currentSelectedStop)
          .map(item => {
            const [h, m] = item.departure.split(':').map(Number);
            const itemTotalMins = h * 60 + m;
            return { ...item, itemTotalMins };
          })
          .filter(item => item.itemTotalMins >= currentTotalMins)
          .sort((a, b) => a.itemTotalMins - b.itemTotalMins)
          .slice(0, 5);

        if (upcoming.length === 0) {
          container.innerHTML = '<div class="empty">本日の該当便はすべて終了しました。</div>';
          return;
        }

        const candidateNames = ['第①候補', '第②候補', '第③候補', '第④候補', '第⑤候補'];

        container.innerHTML = upcoming.map((item, index) => {
          const diffMins = item.itemTotalMins - currentTotalMins;

          let timeText = '';
          if (diffMins >= 60) {
            const hours = Math.floor(diffMins / 60);
            const remainingMins = diffMins % 60;
            if (remainingMins === 0) {
              timeText = `あと ${hours}時間`;
            } else {
              timeText = `あと ${hours}時間 ${remainingMins}分`;
            }
          } else {
            timeText = `あと ${diffMins} 分`;
          }

          const formattedDest = formatDestination(item.destination);

          let badgeHtml = '';
          if (currentMode === 'bus') {
            badgeHtml = `<span class="route-badge">${item.route}</span> 行先: ${formattedDest}`;
          } else {
            badgeHtml = `行先: ${formattedDest}行 (到着: ${item.arrival})`;
          }

          return `
            <div class="card">
              <div class="candidate-tag cand-${index}">${candidateNames[index]}</div>
              <div class="card-header">
                <div class="time-box">
                  <span class="rank-mark mark-${index}"></span>
                  <span class="time">${item.departure}</span>
                  ${currentMode === 'bus' ? `<span class="arrow">➔ ${item.arrival}着</span>` : ''}
                </div>
                <span class="mins badge-${index}">${timeText}</span>
              </div>
              <div class="details">
                ${badgeHtml}
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        container.innerHTML = '<div class="empty">データの読み込みに失敗しました。</div>';
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
    setInterval(updateSchedule, 60000);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('サービスワーカー登録成功:', reg.scope);
            reg.update();
          })
          .catch((err) => { console.log('サービスワーカー登録失敗:', err); });
      });
    }
  </script>
</body>
</html>
