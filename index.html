<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バス時刻表（三軒屋 ➔ 次郎丸駅前）</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; }
    .container { max-width: 400px; width: 100%; }
    h1 { font-size: 1.1rem; text-align: center; color: #555; margin-bottom: 15px; }
    .btn { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; color: white; background: #007bff; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,123,255,0.2); transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .results { margin-top: 20px; }
    .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #007bff; }
    .card-header { display: flex; justify-content: space-between; align-items: baseline; }
    .time { font-size: 1.5rem; font-weight: bold; color: #111; }
    .arrow { color: #888; font-size: 0.9rem; }
    .mins { font-size: 0.9rem; font-weight: bold; color: #d9534f; background: #fdf2f2; padding: 4px 8px; border-radius: 6px; }
    .details { font-size: 0.85rem; color: #666; margin-top: 8px; }
    .badge { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: #495057; }
    .empty { text-align: center; color: #777; margin-top: 30px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1>三軒屋 ➔ 次郎丸駅前</h1>
    <button class="btn" onclick="updateSchedule()">🔄 現在時刻から検索</button>

    <div id="results" class="results"></div>
  </div>

  <script>
    async function updateSchedule() {
      try {
        const response = await fetch('./bus.json');
        const busData = await response.json();

        const now = new Date();
        const currentHours = String(now.getHours()).padStart(2, '0');
        const currentMins = String(now.getMinutes()).padStart(2, '0');
        const currentTimeStr = `${currentHours}:${currentMins}`;
        const currentTotalMins = now.getHours() * 60 + now.getMinutes();

        // 直近3件を取得
        const upcoming = busData
          .filter(bus => bus.departure >= currentTimeStr)
          .sort((a, b) => a.departure.localeCompare(b.departure))
          .slice(0, 3);

        const container = document.getElementById('results');

        if (upcoming.length === 0) {
          container.innerHTML = '<div class="empty">本日の該当便はすべて終了しました。</div>';
          return;
        }

        container.innerHTML = upcoming.map(bus => {
          const [h, m] = bus.departure.split(':').map(Number);
          const busTotalMins = h * 60 + m;
          const diffMins = busTotalMins - currentTotalMins;

          return `
            <div class="card">
              <div class="card-header">
                <div>
                  <span class="time">${bus.departure}</span>
                  <span class="arrow"> ➔ ${bus.arrival}着</span>
                </div>
                <span class="mins">あと ${diffMins} 分</span>
              </div>
              <div class="details">
                <span class="badge">${bus.route}</span> 行先: ${bus.destination}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('results').innerHTML = '<div class="empty">データの読み込みに失敗しました。</div>';
      }
    }

    // ページ表示時に自動実行
    updateSchedule();
  </script>
</body>
</html>
