<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 💡 キャッシュ無効化設定 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>MY TRANSIT 🚌 🚇</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; }
    .container { max-width: 400px; width: 100%; }
    
    /* 📱 アプリタイトル（ヘッダー） */
    .app-title {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      color: #1a252f;
      margin: 10px 0 10px 0;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* 🎨 ロゴ横の可愛いバスイラスト */
    .header-bus-icon {
      height: 50px;
      width: auto;
      object-fit: contain;
    }

    /* ⚡ サイバーチック・モード選択ナビゲーション ⚡ */
    .mode-select-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 12px;
      margin-top: 10px;
    }
    .mode-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .btn-bus {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }
    .btn-subway {
      background: linear-gradient(135deg, #b224ef 0%, #7579ff 100%);
      box-shadow: 0 0 12px rgba(178, 36, 239, 0.4);
    }
    .mode-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    /* 🚍 正面を向いたバスアイコンの位置調整 */
    .mode-icon { 
      font-size: 1.15rem; 
      display: inline-flex;
      align-items: center;
      transform: translateY(-1px);
    }

    /* 🎛 バス停ラジオボタンパネル */
    .bus-stop-panel {
      display: none;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #00f2fe;
    }
    .bus-stop-panel.active {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .radio-label {
      font-size: 0.95rem;
      font-weight: bold;
      color: #2c3e50;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .radio-label input[type="radio"] {
      accent-color: #0052d4;
      transform: scale(1.2);
    }

    /* 💡 長方形枠の区間タイトル ＆ 閉じるボタン */
    .sub-title {
      position: relative;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      color: #0052d4;
      background: #ffffff;
      border: 2px solid #00d2ff;
      border-radius: 8px;
      padding: 10px 40px 10px 10px; /* 右側に閉じるボタン用の余白を確保 */
      margin: 15px 0;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
      display: none;
    }
    
    .close-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #f0f4f8;
      border: 1px solid #bcd;
      color: #666;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-btn:active {
      background: #e0e0e0;
      transform: translateY(-50%) scale(0.9);
    }

    /* ⚡ リアルタイム日時表示ボタン ⚡ */
    .btn { 
      width: 100%; 
      padding: 16px; 
      font-size: 1.15rem; 
      font-weight: 800; 
      color: #ffffff; 
      background: linear-gradient(135deg, #00d2ff 0%, #0052d4 100%); 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); 
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.5px;
    }
    .btn:active { 
      transform: scale(0.97); 
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.7); 
    }

    .results { margin-top: 20px; }
    .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    .rank-0 { border-left: 6px solid #dc3545; }
    .rank-1 { border-left: 6px solid #28a745; }
    .rank-2 { border-left: 6px solid #007bff; }

    .badge-0 { background: #f8d7da; color: #721c24; }
    .badge-1 { background: #d4edda; color: #155724; }
    .badge-2 { background: #cce5ff; color: #004085; }

    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .time-box { display: flex; align-items: center; gap: 8px; }
    .rank-mark { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .mark-0 { background: #dc3545; }
    .mark-1 { background: #28a745; }
    .mark-2 { background: #007bff; }

    .time { font-size: 1.5rem; font-weight: bold; color: #111; }
    .arrow { color: #888; font-size: 0.9rem; }
    .mins { font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; }
    .details { font-size: 0.85rem; color: #666; margin-top: 10px; }
    .route-badge { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: #495057; }
    .empty { text-align: center; color: #777; margin-top: 30px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-title">
      <img src="illust1772_thumb.gif" alt="バス" class="header-bus-icon">
      <span>MY TRANSIT</span>
    </div>

    <div class="mode-select-container">
      <!-- 🚍 アイコンを正面を向いたバス（🚍）に変更 -->
      <button class="mode-btn btn-bus" onclick="toggleBusPanel()">
        <span class="mode-icon">🚍</span> バス停から選択
      </button>
      <button class="mode-btn btn-subway" onclick="toggleSubwayPanel()">
        <span class="mode-icon">🚇</span> 地下鉄から選択
      </button>
    </div>

    <!-- 🎛 バス停ラジオボタン（トグル表示） -->
    <div class="bus-stop-panel" id="bus-panel">
      <label class="radio-label">
        <input type="radio" name="busStop" value="三軒屋" onchange="changeBusStop('三軒屋')"> 三軒屋
      </label>
      <label class="radio-label">
        <input type="radio" name="busStop" value="次郎丸" onchange="changeBusStop('次郎丸')"> 次郎丸
      </label>
    </div>

    <!-- 💡 長方形枠のタイトル ＋ 閉じるボタン -->
    <div class="sub-title" id="route-title">
      <span id="route-text"></span>
      <button class="close-btn" onclick="resetToInitialState()" title="閉じる">✕</button>
    </div>

    <!-- ⚡ リアルタイム日時表示ボタン ⚡ -->
    <button class="btn" id="update-btn" onclick="updateSchedule()">--月--日(--) --:--:--</button>

    <div id="results" class="results"></div>
  </div>

  <script>
    let isStopSelected = false;

    function toggleBusPanel() {
      const panel = document.getElementById('bus-panel');
      panel.classList.toggle('active');
    }

    function toggleSubwayPanel() {
      // 地下鉄ボタンが押されたときの処理
    }

    function changeBusStop(name) {
      isStopSelected = true;
      const title = document.getElementById('route-title');
      const text = document.getElementById('route-text');
      title.style.display = 'block';

      if (name === '三軒屋') {
        text.innerText = '三軒屋 ➔ 次郎丸';
      } else {
        text.innerText = '次郎丸 ➔ 三軒屋';
      }
      updateSchedule();
    }

    // 💡 閉じるボタンを押したときの「初期状態に戻す」処理
    function resetToInitialState() {
      isStopSelected = false;

      // 区間タイトルを隠す
      document.getElementById('route-title').style.display = 'none';

      // バス停ラジオボタンの選択を解除＆パネルをたたむ
      const panel = document.getElementById('bus-panel');
      panel.classList.remove('active');
      const radios = document.getElementsByName('busStop');
      radios.forEach(radio => radio.checked = false);

      // 時刻表表示を消す
      document.getElementById('results').innerHTML = '';
    }

    function updateClock() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayList = ['日', '月', '火', '水', '木', '金', '土'];
      const day = dayList[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      const btn = document.getElementById('update-btn');
      btn.innerText = `${month}月${date}日(${day}) ${hours}:${mins}:${secs}`;
    }

    async function updateSchedule() {
      updateClock();

      if (!isStopSelected) {
        document.getElementById('results').innerHTML = '';
        return;
      }

      try {
        const response = await fetch('./bus.json?v=' + Date.now());
        const busData = await response.json();

        const now = new Date();
        const currentHours = String(now.getHours()).padStart(2, '0');
        const currentMins = String(now.getMinutes()).padStart(2, '0');
        const currentTimeStr = `${currentHours}:${currentMins}`;
        const currentTotalMins = now.getHours() * 60 + now.getMinutes();

        const upcoming = busData
          .filter(bus => bus.departure >= currentTimeStr)
          .sort((a, b) => a.departure.localeCompare(b.departure))
          .slice(0, 3);

        const container = document.getElementById('results');

        if (upcoming.length === 0) {
          container.innerHTML = '<div class="empty">本日の該当便はすべて終了しました。</div>';
          return;
        }

        container.innerHTML = upcoming.map((bus, index) => {
          const [h, m] = bus.departure.split(':').map(Number);
          const busTotalMins = h * 60 + m;
          const diffMins = busTotalMins - currentTotalMins;

          return `
            <div class="card rank-${index}">
              <div class="card-header">
                <div class="time-box">
                  <span class="rank-mark mark-${index}"></span>
                  <span class="time">${bus.departure}</span>
                  <span class="arrow">➔ ${bus.arrival}着</span>
                </div>
                <span class="mins badge-${index}">あと ${diffMins} 分</span>
              </div>
              <div class="details">
                <span class="route-badge">${bus.route}</span> 行先: ${bus.destination}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('results').innerHTML = '<div class="empty">データの読み込みに失敗しました。</div>';
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
    setInterval(updateSchedule, 60000);
  </script>
</body>
</html>
