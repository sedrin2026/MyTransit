<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>MY TRANSIT 🚌 🚇</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; margin: 0; padding: 10px 20px; color: #333; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 400px; width: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
    
    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 4px 0 8px 0;
    }

    /* 💡 タイトル画像の高さを抑える設定 */
    .app-header-image {
      width: 100%;
      max-height: 60px;
      object-fit: contain;
      display: block;
    }

    .mode-select-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 8px;
      margin-top: 4px;
    }
    .mode-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    
    .btn-bus {
      background: linear-gradient(135deg, #ffc285 0%, #ff9e59 100%);
      box-shadow: 0 0 10px rgba(255, 170, 100, 0.4);
    }

    .btn-subway {
      background: linear-gradient(135deg, #a3b899 0%, #7d9670 100%);
      box-shadow: 0 0 10px rgba(125, 150, 112, 0.4);
    }

    .mode-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .mode-icon { 
      font-size: 1.1rem; 
      display: inline-flex;
      align-items: center;
      transform: translateY(-1px);
    }

    .bus-stop-panel {
      display: none;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #ff9e59;
    }
    .bus-stop-panel.active {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .subway-stop-panel {
      display: none;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #7d9670;
    }
    .subway-stop-panel.active {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .radio-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #2c3e50;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bus-stop-panel input[type="radio"] {
      accent-color: #ff8c32;
      transform: scale(1.1);
    }
    .subway-stop-panel input[type="radio"] {
      accent-color: #7d9670;
      transform: scale(1.1);
    }

    .sub-title {
      position: relative;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      color: #d96b00;
      background: #ffffff;
      border: 2px solid #ffb37e;
      border-radius: 8px;
      padding: 8px 40px 8px 10px;
      margin: 10px 0;
      box-shadow: 0 0 10px rgba(255, 179, 126, 0.25);
      display: none;
    }
    .sub-title.subway-theme {
      color: #4a633d;
      border: 2px solid #a3b899;
      box-shadow: 0 0 10px rgba(163, 184, 153, 0.3);
    }
    
    .close-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #f0f4f8;
      border: 1px solid #bcd;
      color: #666;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-btn:active {
      background: #e0e0e0;
      transform: translateY(-50%) scale(0.9);
    }

    .btn { 
      width: 100%; 
      padding: 12px 10px; 
      font-size: 1rem; 
      font-weight: 800; 
      color: #ffffff; 
      background: linear-gradient(135deg, #89c4f4 0%, #5b9bd5 100%); 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      box-shadow: 0 0 10px rgba(91, 155, 213, 0.35); 
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .btn.subway-theme {
      background: linear-gradient(135deg, #a3b899 0%, #68825b 100%);
      box-shadow: 0 0 12px rgba(125, 150, 112, 0.4);
    }
    .btn:active { 
      transform: scale(0.97); 
    }

    .home-maps-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 4px 0 10px 0;
      width: 100%;
    }
    .map-card {
      width: 100%;
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 6px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .map-card.bus-map-card {
      background: linear-gradient(135deg, #fffaf4 0%, #fff2e6 100%);
      border: 1px solid #ffbc85;
      box-shadow: 0 2px 8px rgba(255, 158, 89, 0.15);
    }
    .map-card.bus-map-card .map-title {
      color: #d96b00;
      font-weight: 800;
    }

    .map-card.subway-map-card {
      background: linear-gradient(135deg, #f6f8f5 0%, #ebf0ea 100%);
      border: 1px solid #a3b899;
      box-shadow: 0 2px 8px rgba(125, 150, 112, 0.15);
    }
    .map-card.subway-map-card .map-title {
      color: #4a633d;
      font-weight: 800;
    }

    .map-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
    }
    .map-image {
      max-width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
    }

    .calendar-container {
      display: none;
      width: 100%;
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid #7ea8f8;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    .calendar-container.active {
      display: block;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #3b5998;
      font-size: 0.9rem;
      margin-bottom: 6px;
      padding: 0 4px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      font-size: 0.8rem;
    }
    .calendar-day-header {
      font-weight: bold;
      padding: 2px 0;
      color: #666;
    }
    .calendar-day-header.sun { color: #e74c3c; }
    .calendar-day-header.sat { color: #3498db; }
    .calendar-cell {
      padding: 6px 0;
      border-radius: 4px;
      color: #333;
    }
    .calendar-cell.sun { color: #e74c3c; }
    .calendar-cell.sat { color: #3498db; }
    .calendar-cell.today {
      background-color: #5b9bd5;
      color: #ffffff;
      font-weight: bold;
      border-radius: 50%;
    }

    .results { margin-top: 10px; }
    .card { 
      background: white; 
      padding: 12px 14px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
      border: 1px solid #eee;
    }

    .candidate-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .cand-0 { background-color: #ffeef0; color: #dc3545; border: 1px solid #f5c6cb; }
    .cand-1 { background-color: #eafaf1; color: #28a745; border: 1px solid #c3e6cb; }
    .cand-2 { background-color: #edf5ff; color: #007bff; border: 1px solid #b8daff; }
    .cand-3 { background-color: #fff9e6; color: #d97706; border: 1px solid #fde68a; }
    .cand-4 { background-color: #f3e8ff; color: #7c3aed; border: 1px solid #ddd6fe; }

    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .time-box { display: flex; align-items: center; gap: 8px; }
    .rank-mark { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .mark-0 { background: #dc3545; }
    .mark-1 { background: #28a745; }
    .mark-2 { background: #007bff; }
    .mark-3 { background: #d97706; }
    .mark-4 { background: #7c3aed; }

    .time { font-size: 1.3rem; font-weight: bold; color: #111; }
    .arrow { color: #888; font-size: 0.85rem; }
    .mins { font-size: 0.8rem; font-weight: bold; padding: 3px 6px; border-radius: 6px; }
    
    .badge-0 { background: #f8d7da; color: #721c24; }
    .badge-1 { background: #d4edda; color: #155724; }
    .badge-2 { background: #cce5ff; color: #004085; }
    .badge-3 { background: #fff3cd; color: #856404; }
    .badge-4 { background: #e2d9f3; color: #432874; }

    .details { margin-top: 8px; font-size: 0.85rem; color: #555; border-top: 1px dashed #eee; padding-top: 8px; }
    .route-step { margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .step-icon { font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-header">
      <img src="title.png" alt="MY TRANSIT" class="app-header-image">
    </div>

    <div class="mode-select-container">
      <button class="mode-btn btn-bus" onclick="switchMode('bus')">
        <span class="mode-icon">🚌</span>バス停から選択
      </button>
      <button class="mode-btn btn-subway" onclick="switchMode('subway')">
        <span class="mode-icon">🚇</span>地下鉄から選択
      </button>
    </div>

    <div id="busStopPanel" class="bus-stop-panel">
      <label class="radio-label"><input type="radio" name="busStop" value="a" checked onchange="changeBusStop('a')"> A停留所</label>
      <label class="radio-label"><input type="radio" name="busStop" value="b" onchange="changeBusStop('b')"> B停留所</label>
    </div>

    <div id="subwayStopPanel" class="subway-stop-panel">
      <label class="radio-label"><input type="radio" name="subwayStop" value="meinohama" checked onchange="changeSubwayStop('meinohama')"> 姪浜駅</label>
      <label class="radio-label"><input type="radio" name="subwayStop" value="muromi" onchange="changeSubwayStop('muromi')"> 室見駅</label>
    </div>

    <div id="subTitle" class="sub-title">
      <span id="subTitleText">バス時刻表（A停留所）</span>
      <button class="close-btn" onclick="resetToHome()">✕</button>
    </div>

    <button id="mainActionBtn" class="btn" onclick="toggleCalendar()">📅 2026年8月5日(水) 05:14</button>

    <div id="calendarContainer" class="calendar-container">
      <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="background:none; border:none; color:#3b5998; font-weight:bold; cursor:pointer;">◀</button>
        <span id="calendarTitle">2026年 8月</span>
        <button onclick="changeMonth(1)" style="background:none; border:none; color:#3b5998; font-weight:bold; cursor:pointer;">▶</button>
      </div>
      <div class="calendar-grid">
        <div class="calendar-day-header sun">日</div>
        <div class="calendar-day-header">月</div>
        <div class="calendar-day-header">火</div>
        <div class="calendar-day-header">水</div>
        <div class="calendar-day-header">木</div>
        <div class="calendar-day-header">金</div>
        <div class="calendar-day-header sat">土</div>
      </div>
      <div id="calendarDays" class="calendar-grid" style="margin-top: 4px;"></div>
    </div>

    <div id="homeMaps" class="home-maps-container">
      <div class="map-card bus-map-card">
        <div class="map-title">🚌 西鉄バス路線図</div>
        <img src="bus_map.png" alt="西鉄バス路線図" class="map-image">
      </div>
      <div class="map-card subway-map-card">
        <div class="map-title">🚇 福岡市地下鉄 路線図</div>
        <img src="subway_map.png" alt="福岡市地下鉄 路線図" class="map-image">
      </div>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script>
    let currentMode = 'home';
    let currentBusStop = 'a';
    let currentSubwayStop = 'meinohama';
    let currentDate = new Date(2026, 7, 5);
    let viewYear = 2026;
    let viewMonth = 7;

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('homeMaps').style.display = 'none';
      document.getElementById('calendarContainer').classList.remove('active');

      const busPanel = document.getElementById('busStopPanel');
      const subwayPanel = document.getElementById('subwayStopPanel');
      const subTitle = document.getElementById('subTitle');
      const subTitleText = document.getElementById('subTitleText');
      const mainBtn = document.getElementById('mainActionBtn');

      if (mode === 'bus') {
        busPanel.classList.add('active');
        subwayPanel.classList.remove('active');
        subTitle.style.display = 'block';
        subTitle.classList.remove('subway-theme');
        mainBtn.classList.remove('subway-theme');
        subTitleText.innerText = `バス時刻表（${currentBusStop === 'a' ? 'A停留所' : 'B停留所'}）`;
        mainBtn.innerText = `🚌 バス時刻表を検索 (${currentBusStop === 'a' ? 'A停留所' : 'B停留所'})`;
      } else if (mode === 'subway') {
        subwayPanel.classList.add('active');
        busPanel.classList.remove('active');
        subTitle.style.display = 'block';
        subTitle.classList.add('subway-theme');
        mainBtn.classList.add('subway-theme');
        const stopName = currentSubwayStop === 'meinohama' ? '姪浜駅' : '室見駅';
        subTitleText.innerText = `地下鉄時刻表（${stopName}）`;
        mainBtn.innerText = `🚇 地下鉄時刻表を検索 (${stopName})`;
      }
      renderSchedule();
    }

    function changeBusStop(stop) {
      currentBusStop = stop;
      document.getElementById('subTitleText').innerText = `バス時刻表（${stop === 'a' ? 'A停留所' : 'B停留所'}）`;
      document.getElementById('mainActionBtn').innerText = `🚌 バス時刻表を検索 (${stop === 'a' ? 'A停留所' : 'B停留所'})`;
      renderSchedule();
    }

    function changeSubwayStop(stop) {
      currentSubwayStop = stop;
      const stopName = stop === 'meinohama' ? '姪浜駅' : '室見駅';
      document.getElementById('subTitleText').innerText = `地下鉄時刻表（${stopName}）`;
      document.getElementById('mainActionBtn').innerText = `🚇 地下鉄時刻表を検索 (${stopName})`;
      renderSchedule();
    }

    function resetToHome() {
      currentMode = 'home';
      document.getElementById('busStopPanel').classList.remove('active');
      document.getElementById('subwayStopPanel').classList.remove('active');
      document.getElementById('subTitle').style.display = 'none';
      document.getElementById('calendarContainer').classList.remove('active');
      document.getElementById('homeMaps').style.display = 'flex';
      document.getElementById('mainActionBtn').classList.remove('subway-theme');
      document.getElementById('mainActionBtn').innerText = "📅 2026年8月5日(水) 05:14";
      document.getElementById('results').innerHTML = "";
    }

    function toggleCalendar() {
      if (currentMode === 'home') {
        const cal = document.getElementById('calendarContainer');
        cal.classList.toggle('active');
        if (cal.classList.contains('active')) {
          renderCalendar();
        }
      } else {
        renderSchedule();
      }
    }

    function renderCalendar() {
      const title = document.getElementById('calendarTitle');
      title.innerText = `${viewYear}年 ${viewMonth + 1}月`;
      const daysContainer = document.getElementById('calendarDays');
      daysContainer.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        daysContainer.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell';
        cell.innerText = d;
        const dayOfWeek = new Date(viewYear, viewMonth, d).getDay();
        if (dayOfWeek === 0) cell.classList.add('sun');
        if (dayOfWeek === 6) cell.classList.add('sat');

        if (viewYear === currentDate.getFullYear() && viewMonth === currentDate.getMonth() && d === currentDate.getDate()) {
          cell.classList.add('today');
        }
        daysContainer.appendChild(cell);
      }
    }

    function changeMonth(direction) {
      viewMonth += direction;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
    }

    function renderSchedule() {
      const results = document.getElementById('results');
      results.innerHTML = `
        <div class="card">
          <div style="font-weight: bold; margin-bottom: 6px; color: #333;">
            ${currentMode === 'bus' ? `🚌 バス (${currentBusStop === 'a' ? 'A停留所' : 'B停留所'})` : `🚇 地下鉄 (${currentSubwayStop === 'meinohama' ? '姪浜駅' : '室見駅'})`} の直近のダイヤ
          </div>
          <div class="time-box">
            <span class="rank-mark mark-0"></span>
            <span class="time">05:25</span>
            <span class="arrow">➔</span>
            <span class="mins badge-0">あと11分</span>
          </div>
        </div>
        <div class="card">
          <div class="time-box">
            <span class="rank-mark mark-1"></span>
            <span class="time">05:50</span>
            <span class="arrow">➔</span>
            <span class="mins badge-1">あと36分</span>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
